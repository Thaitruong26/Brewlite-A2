services:
  db:
    image: postgres:16
    container_name: brewlite-a2-db
    restart: always
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - "5434:5432"
    volumes:
      - pgdata-a2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-a2-backend
    restart: always
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: "postgresql://brewlite:brewlite@db:5432/brewlite"
      JWT_SECRET: ${JWT_SECRET:-brewlite-secret-key-change-in-production}
      JWT_EXPIRES_IN: "1d"
      CORS_ORIGIN: "*"
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "/api"
    container_name: brewlite-a2-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "/api"
      INTERNAL_API_URL: "http://backend:4001"
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata-a2:
