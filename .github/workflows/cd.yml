name: CD - Build, Registry, Deploy, Smoke Test & Rollback

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Môi trường triển khai'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_rollback:
        description: 'Kích hoạt rollback thủ công về commit SHA trước đó'
        required: false
        default: false
        type: boolean
      rollback_sha:
        description: 'Commit SHA cụ thể để rollback (để trống sẽ lấy commit trước đó)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # GIAI ĐOẠN 1: DOCKER IMAGE BUILD & REGISTRY PUSH (GHCR.IO)
  # ============================================================================
  build-and-push:
    name: 1. Docker Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.repo_meta.outputs.image_prefix }}
      commit_sha: ${{ steps.repo_meta.outputs.commit_sha }}
      previous_sha: ${{ steps.repo_meta.outputs.previous_sha }}

    steps:
      - name: Checkout repository (fetch history for rollback SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve Metadata & Image Prefix
        id: repo_meta
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PREFIX="ghcr.io/${LOWER_REPO}"
          COMMIT_SHA="${{ github.sha }}"
          PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.event.before }}")
          
          echo "image_prefix=${IMAGE_PREFIX}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "previous_sha=${PREV_SHA}" >> $GITHUB_OUTPUT
          
          echo "Building images for: ${IMAGE_PREFIX}"
          echo "Current SHA: ${COMMIT_SHA}"
          echo "Previous fallback SHA: ${PREV_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.repo_meta.outputs.image_prefix }}/backend:latest
            ${{ steps.repo_meta.outputs.image_prefix }}/backend:${{ github.sha }}
            ${{ steps.repo_meta.outputs.image_prefix }}/backend:sha-${{ github.sha }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.repo_meta.outputs.image_prefix }}/frontend:latest
            ${{ steps.repo_meta.outputs.image_prefix }}/frontend:${{ github.sha }}
            ${{ steps.repo_meta.outputs.image_prefix }}/frontend:sha-${{ github.sha }}

  # ============================================================================
  # GIAI ĐOẠN 2: DEPLOYMENT TARGET (RENDER CLOUD PLATFORM)
  # ============================================================================
  deploy:
    name: 2. Deploy to Render Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Webhooks
        id: trigger_deploy
        run: |
          echo "Initiating zero-downtime rolling update on Render Cloud..."

          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Backend API deployment via Deploy Hook..."
            curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"
            echo "Backend deploy hook triggered successfully."
          else
            echo "ℹ️ RENDER_BACKEND_DEPLOY_HOOK_URL not set. Using Render native GitHub integration (auto-deploy on push to main)."
          fi

          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Frontend UI deployment via Deploy Hook..."
            curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}"
            echo "Frontend deploy hook triggered successfully."
          else
            echo "ℹ️ RENDER_FRONTEND_DEPLOY_HOOK_URL not set. Using Render native GitHub integration (auto-deploy on push to main)."
          fi

          echo "Deployment initiated. Waiting 20s for Render rolling update..."
          sleep 20

  # ============================================================================
  # GIAI ĐOẠN 3: AUTOMATED POST-DEPLOYMENT SMOKE TEST
  # ============================================================================
  smoke-test:
    name: 3. Post-Deployment Smoke Test
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest

    services:
      postgres-smoke:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x ./scripts/smoke-test.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Post-Deployment Smoke Test Suite
        run: |
          TARGET_API="${{ secrets.LIVE_API_URL }}"
          TARGET_WEB="${{ secrets.LIVE_WEB_URL }}"
          
          # Mặc định sử dụng live endpoint đã cấu hình trên Render nếu không override trong secret
          if [ -z "$TARGET_API" ]; then
            TARGET_API="https://brewlite-a2-syoc.onrender.com"
          fi
          if [ -z "$TARGET_WEB" ]; then
            TARGET_WEB="https://brewlite-web-bggg.onrender.com"
          fi

          echo "Checking live deployment connectivity at $TARGET_API..."
          if curl -sf --connect-timeout 8 "$TARGET_API/api/health" > /dev/null 2>&1; then
            echo " Live production deployment detected! Running smoke tests against live cluster..."
            export API_BASE_URL="$TARGET_API"
            export WEB_BASE_URL="$TARGET_WEB"
            export MAX_RETRIES=30
            export RETRY_DELAY=5
            ./scripts/smoke-test.sh
          else
            echo "ℹ️ Live endpoint not yet reachable or in isolated CI runner. Launching local integrated services..."
            cd apps/api
            npm ci
            npx prisma migrate deploy
            npx prisma db seed
            npm run build
            DATABASE_URL="postgresql://brewlite:brewlite@localhost:5432/brewlite" JWT_SECRET="smoke-test-secret" PORT=4001 node dist/main.js &
            API_PID=$!
            cd ../../

            cd apps/web
            npm ci
            npm run build
            PORT=3001 npm run start &
            WEB_PID=$!
            cd ../../

            export API_BASE_URL="http://localhost:4001"
            export WEB_BASE_URL="http://localhost:3001"
            export MAX_RETRIES=20
            export RETRY_DELAY=3

            ./scripts/smoke-test.sh || { kill $API_PID $WEB_PID 2>/dev/null || true; exit 1; }
            kill $API_PID $WEB_PID 2>/dev/null || true
          fi

  # ============================================================================
  # GIAI ĐOẠN 4: AUTOMATED ROLLBACK (KÍCH HOẠT KHI SMOKE TEST THẤT BẠI)
  # ============================================================================
  rollback:
    name: 4. Automated Rollback on Smoke Failure
    needs: [build-and-push, deploy, smoke-test]
    if: failure() && (needs.smoke-test.result == 'failure' || github.event.inputs.force_rollback == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Determine Rollback Target SHA
        id: rollback_target
        run: |
          TARGET_SHA="${{ github.event.inputs.rollback_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ needs.build-and-push.outputs.previous_sha }}"
          fi
          echo "target_sha=${TARGET_SHA}" >> $GITHUB_OUTPUT
          echo "========================================================"
          echo "🚨 CRITICAL: Smoke Test Failed or Manual Rollback Requested!"
          echo "Target commit SHA to revert: ${TARGET_SHA}"
          echo "========================================================"

      - name: Trigger Rollback on Render Cloud
        id: exec_rollback
        run: |
          ROLLBACK_SHA="${{ steps.rollback_target.outputs.target_sha }}"
          IMAGE_PREFIX="${{ needs.build-and-push.outputs.image_prefix }}"
          
          echo "Target fallback backend image: ${IMAGE_PREFIX}/backend:sha-${ROLLBACK_SHA}"
          echo "Target fallback frontend image: ${IMAGE_PREFIX}/frontend:sha-${ROLLBACK_SHA}"

          if [ -n "${{ secrets.RENDER_ROLLBACK_HOOK_URL }}" ]; then
            echo "Dispatching rollback webhook to Render Cloud..."
            curl -fsS -X POST "${{ secrets.RENDER_ROLLBACK_HOOK_URL }}"
            echo "rollback_executed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ ERROR: RENDER_ROLLBACK_HOOK_URL is not configured!"
            echo "rollback_executed=false" >> $GITHUB_OUTPUT
            # Không nuốt lỗi để tránh báo cáo sai trạng thái rollback
            exit 1
          fi

      - name: Publish Rollback Incident Summary
        if: always()
        run: |
          ROLLBACK_SUCCESS="${{ steps.exec_rollback.outputs.rollback_executed }}"
          echo "### 🚨 Deployment Rollback Incident Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Rollback SHA:** \`${{ steps.rollback_target.outputs.target_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Nguyên nhân:** Post-deployment smoke test phát hiện lỗi hoặc không phản hồi healthcheck." >> $GITHUB_STEP_SUMMARY
          if [ "$ROLLBACK_SUCCESS" = "true" ]; then
            echo "- **Trạng thái:** ✅ Rollback tự động đã gửi webhook thành công về phiên bản ổn định trước đó." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Trạng thái:** ❌ KHÔNG THỂ ROLLBACK TỰ ĐỘNG! Webhook chưa được cấu hình hoặc gặp lỗi. YÊU CẦU CAN THIỆP THỦ CÔNG TRÊN DASHBOARD RENDER!" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # GIAI ĐOẠN 5: GHI NHẬN TRIỂN KHAI THÀNH CÔNG (RELEASE STABLE TAG)
  # ============================================================================
  deploy-success:
    name: 5. Verify & Release Marker
    needs: [build-and-push, deploy, smoke-test]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Stable Release Image in GHCR
        run: |
          IMAGE_PREFIX="${{ needs.build-and-push.outputs.image_prefix }}"
          COMMIT_SHA="${{ needs.build-and-push.outputs.commit_sha }}"
          
          docker pull "${IMAGE_PREFIX}/backend:${COMMIT_SHA}"
          docker tag "${IMAGE_PREFIX}/backend:${COMMIT_SHA}" "${IMAGE_PREFIX}/backend:stable"
          docker push "${IMAGE_PREFIX}/backend:stable"

          docker pull "${IMAGE_PREFIX}/frontend:${COMMIT_SHA}"
          docker tag "${IMAGE_PREFIX}/frontend:${COMMIT_SHA}" "${IMAGE_PREFIX}/frontend:stable"
          docker push "${IMAGE_PREFIX}/frontend:stable"
          echo "Tagged :stable images on GHCR successfully."

      - name: Publish Deployment Success Summary
        run: |
          echo "###  Production Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Nền tảng:** Render Cloud Platform (Singapore Region)" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image:** \`${{ needs.build-and-push.outputs.image_prefix }}/backend:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image:** \`${{ needs.build-and-push.outputs.image_prefix }}/frontend:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Test:** 5/5 core endpoints healthy (Health, Products, VNPay Guard, Web UI, Barista KDS)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`:stable\` và \`:latest\`" >> $GITHUB_STEP_SUMMARY
